aid: 3jane
name: 3Jane
description: >-
  3Jane is an Ethereum-mainnet credit-based money market that issues algorithmic,
  real-time uncollateralized USDC credit lines underwritten against verifiable
  financial proofs rather than on-chain collateral. Its 3CA credit-assessment
  algorithm and Jane Score combine on-chain history with off-chain signals
  (bank data via Plaid, VantageScore/credit metadata, zkTLS proofs via Reclaim
  Protocol and EigenLayer). Capital suppliers deposit USDC to mint USD3, a
  yieldcoin with a senior claim on interest repayments, or stake it for sUSD3, a
  junior tranche that earns levered yield while absorbing first losses. Backing
  comes from Fintech Credit Conduits (warehouse loans and forward-flow programs
  for U.S. fintech lenders) and Crypto Credit Lines. The protocol is governed by
  a timelock and multisig and coordinated by the JANE token. 3Jane raised a
  $5.2M seed round led by Paradigm, with Coinbase Ventures and Wintermute
  Ventures participating.
